<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MI@MI Boutique</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#160A2E;color:#F7EEFF;font-family:'Manrope',sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;top:-120px;width:280px;height:280px;border-radius:50%;filter:blur(90px);opacity:.4;z-index:0;pointer-events:none}
header,main{position:relative;z-index:1}
header{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:flex-end}
.kicker{font-size:11px;font-weight:800;letter-spacing:5px;color:#19E3D0}
.logo{font-family:'Anton',sans-serif;font-size:50px;letter-spacing:2px;line-height:1;margin-top:6px;text-shadow:4px 4px 0 #19E3D0}
.pill{padding:6px 12px;border:2px solid #FF8A3D;border-radius:999px;font-family:'Anton',sans-serif;font-size:14px;letter-spacing:3px;color:#FF8A3D}
main{padding:4px 16px 110px;max-width:560px;margin:0 auto}
.card{background:rgba(13,6,32,.7);border:1.5px solid #3A2366;border-radius:18px;overflow:hidden;margin-bottom:12px}
.media{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#22103F}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.info{flex:1;min-width:0}
.cat{font-size:10px;font-weight:800;letter-spacing:3px}
.nom{font-weight:800;font-size:16px;margin-top:2px}
.desc{font-size:12px;color:#C9B8E6;margin-top:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.prix{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:1px}
.qty{display:flex;align-items:center;gap:8px}
button{font-family:'Manrope',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.add{min-width:44px;height:38px;padding:0 16px;border-radius:999px;border:none;background:#19E3D0;color:#0D0620;font-weight:800;font-size:13px}
.rond{width:38px;height:38px;border-radius:50%;font-size:18px;font-weight:800}
.moins{border:1.5px solid #FF3E9A;background:transparent;color:#FF3E9A}
.plus{border:none;background:#19E3D0;color:#0D0620}
.titre{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:2px;margin:18px 0 8px}
.contact .card{padding:14px 16px}
.label{font-size:11px;font-weight:800;letter-spacing:3px}
.val{font-weight:800;font-size:16px;margin-top:4px}
.msg{padding:30px 10px;text-align:center;color:#C9B8E6}
</style>
</head>
<body>
<div class="blob" style="left:-120px;background:#FF2E4D"></div>
<div class="blob" style="right:-120px;background:#2E6BFF"></div>

<header>
  <div>
    <div class="kicker">MIAMI VIBES · MONEY TALKS</div>
    <div class="logo">MI@MI</div>
  </div>
  <div class="pill">FIVESTARS</div>
</header>

<main>
  <div id="liste"><div class="msg">Chargement du menu…</div></div>

  <div class="contact">
    <div class="titre" style="text-shadow:3px 3px 0 #FF8A3D">CONTACT</div>
    <div class="card"><div class="label" style="color:#19E3D0">TELEGRAM</div><div class="val">@ton_pseudo</div></div>
    <div class="card"><div class="label" style="color:#FF3E9A">INSTAGRAM</div><div class="val">@ton_instagram</div></div>
    <div class="card"><div class="label" style="color:#FF8A3D">ADRESSE</div><div class="val">Ton adresse</div></div>
  </div>
</main>

<script>
const COULEURS = { "BURGERS": "#FF8A3D", "À CÔTÉ": "#19E3D0", "BOISSONS": "#FF3E9A", "FORMULE": "#FFE27A" };
const tg = window.Telegram ? window.Telegram.WebApp : null;
const panier = {};
let PRODUITS = [];
const chf = n => Number(n).toFixed(2) + " CHF";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function media(p) {
  if (p.video) {
    const poster = p.photo ? ` poster="${esc(p.photo)}"` : "";
    return `<video class="media" src="${esc(p.video)}"${poster} muted loop playsinline autoplay preload="metadata"></video>`;
  }
  if (p.photo) {
    return `<img class="media" src="${esc(p.photo)}" alt="${esc(p.nom)}" loading="lazy" onerror="this.remove()">`;
  }
  return "";
}

function total() {
  return PRODUITS.reduce((t, p) => t + p.prix * (panier[p.id] || 0), 0);
}

function rendu() {
  document.getElementById("liste").innerHTML = PRODUITS.map(p => {
    const q = panier[p.id] || 0;
    const couleur = COULEURS[p.categorie] || "#19E3D0";
    const boutons = q
      ? `<div class="qty"><button class="rond moins" data-id="${esc(p.id)}" data-d="-1" aria-label="Retirer">−</button><b>${q}</b><button class="rond plus" data-id="${esc(p.id)}" data-d="1" aria-label="Ajouter">+</button></div>`
      : `<button class="add" data-id="${esc(p.id)}" data-d="1">Ajouter</button>`;
    return `<div class="card">${media(p)}<div class="row"><div class="info"><div class="cat" style="color:${couleur}">${esc(p.categorie)}</div><div class="nom">${esc(p.nom)}</div><div class="desc">${esc(p.description)}</div></div><div class="right"><div class="prix">${chf(p.prix)}</div>${boutons}</div></div></div>`;
  }).join("");

  if (tg) {
    const t = total();
    if (t > 0) {
      tg.MainButton.setParams({ text: "COMMANDER · " + chf(t), color: "#FF3E9A", text_color: "#FFFFFF" });
      tg.MainButton.show();
    } else {
      tg.MainButton.hide();
    }
  }
}

document.getElementById("liste").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const id = b.dataset.id;
  panier[id] = Math.max(0, (panier[id] || 0) + Number(b.dataset.d));
  if (!panier[id]) delete panier[id];
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  rendu();
});

if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#160A2E"); tg.setBackgroundColor("#160A2E"); } catch (e) {}
  tg.MainButton.onClick(() => {
    const articles = Object.keys(panier).map(id => ({ id, qte: panier[id] }));
    tg.sendData(JSON.stringify({ articles }));
  });
}

fetch("produits.json?v=" + Date.now())
  .then(r => r.json())
  .then(liste => { PRODUITS = liste; rendu(); })
  .catch(() => {
    document.getElementById("liste").innerHTML = '<div class="msg">Le menu n\'a pas pu se charger. Vérifie le fichier produits.json.</div>';
  });
</script>
</body>
</html>
